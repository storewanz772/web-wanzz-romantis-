
wanzzzzz nihh bossss<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untukk cintahh kuuu ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", cursive, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    .card {
      width: 90%;
      max-width: 450px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    .heart {
      font-size: 70px;
      animation: denyut 1s infinite;
    }

    @keyframes denyut {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    h1 {
      color: #ff4f81;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 18px;
      line-height: 1.6;
    }

    button {
      border: none;
      padding: 13px 22px;
      margin: 8px;
      border-radius: 25px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: 0.3s;
    }

    #yes {
      background: #ff4f81;
      color: white;
    }

    #yes:hover {
      transform: scale(1.1);
      background: #ff2865;
    }

    #no {
      background: #ddd;
      color: #555;
      position: relative;
    }

    .love-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #fff0f5;
      border-radius: 20px;
      color: #ff4081;
      font-weight: bold;
      animation: muncul 0.6s ease;
    }

    @keyframes muncul {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      animation: naik 5s linear forwards;
      pointer-events: none;
    }

    @keyframes naik {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>Hai SAYANGG ACUUUU🥰</h1>

    <p>
      Akuu sayangg kamuu bangettt
      kamuu sayanggg acuu ndaaa
    </p>

    <p>
      <b>kamuuuu sayangg acuuu ndaaaa 💕</b>
    </p>

    <button id="yes" onclick="terimaCinta()">
      sayanggggg ❤️
    </button>

    <button id="no" onmouseover="kabur()">
      sayanggg pake bngtt 😝
    </button>

    <div class="love-message" id="message">
      YEEEYYY! 😭❤️<br><br>
      cintaaa akuu sealuu yakk cntahh
      <b>cintahhhh!</b> 🥰💖
      <br><br>
      Jangan pergi ya... nanti aku kangen 🥺
    </div>

  </div>

  <script>

    function terimaCinta() {
      document.getElementById("message").style.display = "block";

      // Membuat banyak hati ❤️
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          buatHati();
        }, i * 100);
      }
    }

    function kabur() {
      const tombol = document.getElementById("no");

      const x = Math.random() * 250 - 125;
      const y = Math.random() * 200 - 100;

      tombol.style.transform =
        `translate(${x}px, ${y}px)`;

      tombol.innerText = "Hehehe nggak bisa 😝";
    }

    function buatHati() {
      const heart = document.createElement("div");

      heart.classList.add("floating-heart");
      heart.innerHTML = ["❤️", "💕", "💖", "💗", "💘"][Math.floor(Math.random() * 5)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration =
        (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

  </script>

</body>
</html>
